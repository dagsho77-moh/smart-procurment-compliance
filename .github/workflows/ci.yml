name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock   # CI never calls a real LLM and needs no secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Agent boundary contracts (import-linter)
        run: lint-imports
      - name: Tests
        run: pytest -q
      - name: Evaluate on synthetic invoices (mock LLM)
        run: python -m invoice_guard evaluate --fail-under 1.0
